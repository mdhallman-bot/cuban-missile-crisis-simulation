<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuban Missile Crisis — October 1962</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --us:#1a3a5c;--us-light:#ddeaf8;--us-mid:#2e5f8a;--us-dark:#0d1e30;
  --ussr:#6b1010;--ussr-light:#f5dada;--ussr-mid:#922020;--ussr-dark:#200808;
  --ink:#111111;--ink-mid:#2a2420;--ink-light:#4a403a;--ink-faint:#6b5f57;
  --paper:#f5f0e8;--paper-dark:#ece4d5;--paper-mid:#f0ead8;
  --gold:#7a5c0e;--gold-light:#b08a20;--gold-faint:#f5edd0;
  --border:rgba(20,16,12,.18);--rad:6px;
  --good-bg:#e8f5e8;--good-bdr:#3a8a3a;--good-txt:#1a3a1a;
  --bad-bg:#fceaea;--bad-bdr:#b03030;--bad-txt:#4a1010;
  --neu-bg:#f0f0f8;--neu-bdr:#7878aa;--neu-txt:#22224a;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Source Serif 4',Georgia,serif;font-weight:400;background:var(--paper);color:var(--ink);min-height:100vh;line-height:1.6}

/* ── SCREENS ── */
.screen{display:none;min-height:100vh}
.screen.active{display:block}
#setupScreen{background:#080808;align-items:center;justify-content:center;padding:2rem}
#setupScreen.active{display:flex}

/* ── SETUP ── */
.setup-card{background:#111;border:1px solid #222;border-radius:12px;padding:2.5rem;max-width:560px;width:100%;color:#ede8dc}
.setup-eyebrow{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:#555;margin-bottom:.4rem}
.setup-title{font-family:'Playfair Display',serif;font-size:2.1rem;font-weight:700;color:#ede8dc;margin-bottom:.2rem;line-height:1.2}
.setup-subtitle{font-family:'Playfair Display',serif;font-style:italic;font-size:.95rem;color:#666;margin-bottom:1.6rem;padding-bottom:1.4rem;border-bottom:1px solid #1e1e1e}
.sf{margin-bottom:1.1rem}
.sf label{display:block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:#777;margin-bottom:.35rem}
.sf input,.sf select{width:100%;background:#1a1a1a;border:1px solid #2e2e2e;border-radius:6px;padding:.6rem .8rem;font-family:'Source Serif 4',serif;font-size:.95rem;color:#ede8dc;outline:none;transition:border-color .2s}
.sf input:focus,.sf select:focus{border-color:#555}
.sf select option{background:#1a1a1a}
.team-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1.2rem}
.team-opt{border:2px solid #222;border-radius:8px;padding:.9rem;cursor:pointer;text-align:center;transition:all .2s;background:#161616}
.team-opt:hover{border-color:#444}
.team-opt.sel-us{border-color:#2e5f8a;background:#0a1824}
.team-opt.sel-ussr{border-color:#922020;background:#1a0808}
.team-flag{font-size:1.8rem;margin-bottom:.3rem}
.team-name{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:#666}
.team-opt.sel-us .team-name{color:#7aadde}
.team-opt.sel-ussr .team-name{color:#de8a8a}
.role-desc-box{background:#1a1a1a;border:1px solid #2e2e2e;border-radius:6px;padding:.7rem .9rem;font-size:.83rem;color:#999;margin-top:.4rem;line-height:1.6;display:none}
.role-desc-box.vis{display:block}
.setup-btn{width:100%;background:#ede8dc;color:#080808;border:none;border-radius:8px;padding:.85rem;font-family:'Source Serif 4',serif;font-size:.95rem;font-weight:600;cursor:pointer;letter-spacing:.04em;transition:opacity .2s;margin-top:.5rem}
.setup-btn:hover{opacity:.88}

/* ── SIM HEADER ── */
.sim-hdr{background:#080808;color:#ede8dc;padding:.6rem 1.4rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:200;border-bottom:1px solid #1a1a1a}
.hdr-left{display:flex;align-items:center;gap:10px}
.hdr-title{font-family:'Playfair Display',serif;font-size:.95rem}
.stag{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;padding:2px 9px;border-radius:20px;border:1px solid #222;color:#666}
.stag.us{color:#7aadde;border-color:#2e5f8a}
.stag.ussr{color:#de8a8a;border-color:#922020}
.hdr-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.esc-wrap{display:flex;align-items:center;gap:7px}
.esc-lbl{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:#444}
.esc-bar{width:130px;height:6px;background:#1a1a1a;border-radius:3px;overflow:hidden;border:1px solid #2a2a2a}
.esc-fill{height:100%;border-radius:3px;transition:width .8s ease,background .8s ease}
.esc-num{font-size:.8rem;font-weight:700;min-width:16px;color:#ede8dc}
.pips{display:flex;gap:5px;align-items:center}
.pip{width:7px;height:7px;border-radius:50%;background:#1a1a1a;border:1px solid #2a2a2a;transition:all .3s}
.pip.done{background:#3a3a3a;border-color:#555}
.pip.active{background:#ede8dc;border-color:#ede8dc}

/* ── BODY ── */
.sim-body{padding:1.4rem;max-width:900px;margin:0 auto}

/* ── ROUND HEADING ── */
.rnd-head{margin-bottom:1rem}
.rnd-num{font-size:.66rem;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:3px}
.rnd-title{font-family:'Playfair Display',serif;font-size:1.35rem;font-weight:700;color:var(--ink);margin-bottom:2px}
.rnd-date{font-size:.82rem;color:var(--ink-light);font-style:italic}

/* ── PHASE BADGE ── */
.pbadge{display:inline-flex;align-items:center;gap:7px;padding:3px 11px;border-radius:20px;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;margin-bottom:.9rem}
.pdot{width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
.ph-us{background:var(--us-light);color:#0d2a4a;border:1px solid #a0c4e0}
.ph-ussr{background:var(--ussr-light);color:#3a0808;border:1px solid #d09090}
.ph-both{background:var(--gold-faint);color:var(--gold);border:1px solid #c8a840}
.ph-wait{background:#f0f0f0;color:#3a3a3a;border:1px solid #bbb}
.ph-ark{background:#140000;color:#de8a8a;border:1px solid #6b1010}

/* ── IMAGE PANEL ── */
.img-panel{margin-bottom:1rem;border-radius:var(--rad);overflow:hidden;border:1px solid var(--border)}
.img-panel img{width:100%;height:220px;object-fit:cover;object-position:center;display:block}
.img-caption{background:#1a1a1a;color:#888;font-size:.72rem;padding:.4rem .75rem;font-style:italic;line-height:1.4}
.img-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1rem}
.img-pair .img-panel{margin-bottom:0}
.img-pair .img-panel img{height:180px}

/* ── INTEL CARD ── */
.intel{border-radius:var(--rad);padding:1.1rem 1.3rem;margin-bottom:1rem;border-left:4px solid}
.int-us{background:var(--us-light);border-color:var(--us)}
.int-ussr{background:var(--ussr-light);border-color:var(--ussr)}
.int-neu{background:var(--paper-dark);border-color:var(--gold)}
.intel-eye{font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:.5rem}
.intel p{font-size:.92rem;color:var(--ink-mid);line-height:1.75;margin-bottom:.5rem}
.intel p:last-child{margin-bottom:0}
.intel strong{color:var(--ink);font-weight:600}
.unconf{background:#fef8e8;border:1px dashed var(--gold-light);border-radius:4px;padding:.5rem .75rem;margin-top:.6rem;font-size:.82rem;color:var(--gold);line-height:1.5}
.unconf::before{content:"⚠ Unconfirmed: ";font-weight:600}

/* ── SECTION CARD ── */
.scard{background:white;border:1px solid var(--border);border-radius:var(--rad);padding:1.1rem 1.3rem;margin-bottom:.9rem}
.scard h3{font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;margin-bottom:.65rem;color:var(--ink)}
.scard-eye{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:.25rem}
.flabel{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-light);margin-bottom:.3rem;display:block;margin-top:.55rem}
.fnote{font-size:.78rem;color:var(--ink-faint);font-style:italic;margin-top:.25rem;line-height:1.5}

/* ── ROLE TAG ── */
.rtag{display:inline-block;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:10px;margin-bottom:.6rem}
.rt-hawk{background:#fef0c0;color:#7a4a00}
.rt-dove{background:#d8f5d8;color:#1a4a1a}
.rt-dip{background:#d8e8fc;color:#0d2860}
.rt-hard{background:#fce0e0;color:#6a1010}
.rt-prag{background:#fef0c0;color:#7a4a00}
.rt-cuba{background:#eeddf8;color:#4a1070}

/* ── TEXTAREAS ── */
textarea{width:100%;border:1px solid var(--border);border-radius:4px;padding:.65rem .75rem;font-family:'Source Serif 4',serif;font-size:.9rem;font-weight:400;color:var(--ink);background:var(--paper);resize:vertical;line-height:1.65;min-height:80px;outline:none;transition:border-color .2s}
textarea:focus{border-color:var(--ink-light)}
textarea::placeholder{color:#b0a090}

/* ── DECISION GRID ── */
.dec-section{margin-bottom:.9rem}
.dec-section-title{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;padding:.5rem .75rem;border-radius:var(--rad) var(--rad) 0 0;margin-bottom:0}
.dec-title-us{background:var(--us);color:white}
.dec-title-ussr{background:var(--ussr);color:white}
.dec-title-locked-us{background:#4a6a8a;color:#ccdaee}
.dec-title-locked-ussr{background:#7a3030;color:#eedada}
.dec-opts{display:flex;flex-direction:column;gap:7px;padding:.75rem;background:white;border:1px solid var(--border);border-top:none;border-radius:0 0 var(--rad) var(--rad)}

/* ── DECISION OPTION CARD ── */
.dec-opt{display:flex;align-items:flex-start;gap:11px;padding:.75rem .9rem;border:2px solid var(--border);border-radius:var(--rad);cursor:pointer;transition:all .15s;background:white}
.dec-opt:hover:not(.locked-opt):not(.confirmed-opt){border-color:var(--ink-light)}
.dec-opt.sel-us{border-color:var(--us);background:var(--us-light)}
.dec-opt.sel-ussr{border-color:var(--ussr);background:var(--ussr-light)}
.dec-opt input[type=radio]{margin-top:3px;flex-shrink:0;accent-color:var(--us)}
.dec-opt.ussr-r input[type=radio]{accent-color:var(--ussr)}
.dec-lbl{font-size:.88rem;line-height:1.55;color:var(--ink-mid)}
.dec-lbl strong{color:var(--ink);font-weight:600}

/* Locked options — other side's choices, display only until confirmed */
.locked-opt{opacity:.55;cursor:default;background:#f8f8f8;border-color:#ddd}
.locked-opt:hover{border-color:#ddd}
.lock-icon{font-size:.8rem;margin-right:4px;color:#aaa}

/* Confirmed option — what you heard them choose */
.confirmed-opt{border-color:var(--gold);background:var(--gold-faint);cursor:default;opacity:1}
.confirmed-opt .dec-lbl strong{color:var(--gold)}
.conf-badge{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;background:var(--gold);color:white;padding:1px 6px;border-radius:8px;margin-left:8px;vertical-align:middle}

/* Pending confirm — selectable to record what you heard */
.pending-opt{opacity:.85;cursor:pointer;background:#fefef5;border-color:#cca820}
.pending-opt:hover{border-color:var(--gold);background:var(--gold-faint);opacity:1}

/* ── LOCKED OVERLAY NOTE ── */
.locked-note{background:#f5f5f5;border:1px dashed #bbb;border-radius:var(--rad);padding:.75rem 1rem;font-size:.84rem;color:#666;text-align:center;margin-bottom:.6rem;line-height:1.5}
.locked-note strong{color:#444}

/* ── SITUATION REPORT ── */
.sit-rep{background:#080808;border-radius:var(--rad);padding:1.3rem 1.5rem;margin-bottom:1rem;color:#ede8dc}
.sit-rep-title{font-family:'Playfair Display',serif;font-size:1rem;color:#c8a840;margin-bottom:.8rem}
.sit-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:.9rem}
.sit-cell{border-radius:4px;padding:.75rem .9rem}
.sit-us-cell{background:#0d1e30;border:1px solid #1e3a5a}
.sit-ussr-cell{background:#1e0808;border:1px solid #3a1010}
.sit-cell-lbl{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:.3rem}
.sit-us-cell .sit-cell-lbl{color:#7aadde}
.sit-ussr-cell .sit-cell-lbl{color:#de8a8a}
.sit-cell-val{font-size:.88rem;color:#ede8dc;line-height:1.55}
.sit-outcome{border-radius:4px;padding:.8rem .9rem;font-size:.9rem;line-height:1.7}
.sit-good{background:#081808;border:1px solid #2a5a2a;color:#90d090}
.sit-bad{background:#180808;border:1px solid #5a1818;color:#e09090}
.sit-neu{background:#0a0a18;border:1px solid #2a2a4a;color:#a0a0d0}
.sit-esc{text-align:center;font-size:.76rem;color:#666;margin-top:.6rem}

/* ── WAITING BOX ── */
.wait-box{text-align:center;padding:1.5rem;background:var(--paper-dark);border:1px solid var(--border);border-radius:var(--rad);margin:.8rem 0}
.wait-box p{color:var(--ink-mid);font-size:.88rem}

/* ── CONSEQUENCE CARD ── */
.con-card{border-radius:var(--rad);padding:1.2rem 1.4rem;margin-bottom:.9rem;border:1px solid}
.con-good{background:var(--good-bg);border-color:var(--good-bdr)}
.con-bad{background:var(--bad-bg);border-color:var(--bad-bdr)}
.con-neu{background:var(--neu-bg);border-color:var(--neu-bdr)}
.con-crit{background:#060000;border-color:#5a0808;color:#ede8dc}
.con-title{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:700;margin-bottom:.4rem}
.con-good .con-title{color:var(--good-txt)}
.con-bad .con-title{color:var(--bad-txt)}
.con-neu .con-title{color:var(--neu-txt)}
.con-crit .con-title{color:#de8a8a}
.con-body{font-size:.9rem;line-height:1.72}
.con-good .con-body{color:#1e4a1e}
.con-bad .con-body{color:#4a1010}
.con-neu .con-body{color:#22224a}
.con-crit .con-body{color:#bbb}

/* ── ARKHIPOV ── */
.ark-card{background:#060000;border:2px solid #5a0808;border-radius:var(--rad);padding:1.3rem 1.5rem;color:#ede8dc;margin-bottom:.9rem}
.ark-hdr{font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;color:#de5050;margin-bottom:.5rem;font-weight:600}
.ark-body{font-size:.88rem;line-height:1.75;color:#aaa;margin-bottom:.9rem}
.ark-choices{display:flex;flex-direction:column;gap:8px}
.ark-btn{padding:.65rem .9rem;border-radius:5px;border:2px solid;font-family:'Source Serif 4',serif;font-size:.88rem;cursor:pointer;font-weight:600;transition:all .2s;text-align:left}
.ark-yes{border-color:#5a0808;background:#180000;color:#ede8dc}
.ark-yes:hover{background:#260000}
.ark-no{border-color:#183018;background:#060c06;color:#ede8dc}
.ark-no:hover{background:#0e1a0e}

/* ── BACKGROUND PAGE ── */
.bg-page{background:white;border:1px solid var(--border);border-radius:var(--rad);overflow:hidden;margin-bottom:1rem}
.bg-hdr{background:#080808;color:#ede8dc;padding:1.4rem 1.6rem}
.bg-hdr-title{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;margin-bottom:.2rem}
.bg-hdr-sub{font-size:.8rem;color:#888}
.bg-body{padding:1.4rem 1.6rem}
.bg-sec{margin-bottom:1.2rem}
.bg-sec-title{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-light);font-weight:600;margin-bottom:.5rem;padding-bottom:.3rem;border-bottom:1px solid var(--border)}
.bg-sec p{font-size:.92rem;color:var(--ink-mid);line-height:1.75;margin-bottom:.5rem}
.bg-sec p:last-child{margin-bottom:0}
.bg-grid{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;margin-top:.5rem}
.bg-fact{background:var(--paper);border:1px solid var(--border);border-radius:4px;padding:.75rem .9rem}
.bg-fact-lbl{font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:.3rem}
.bg-fact-val{font-size:.88rem;color:var(--ink-mid);line-height:1.6}
.bg-tension{background:var(--paper-dark);border-left:3px solid var(--gold);border-radius:0 4px 4px 0;padding:.65rem .9rem;margin:.4rem 0;font-size:.88rem;color:var(--ink-mid);line-height:1.65}

/* ── BUTTONS ── */
.sbtn{display:block;width:100%;padding:.82rem;border:none;border-radius:7px;font-family:'Source Serif 4',serif;font-size:.93rem;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.03em;margin-top:.4rem}
.sbtn-us{background:var(--us);color:white}
.sbtn-us:hover{background:var(--us-mid)}
.sbtn-ussr{background:var(--ussr);color:white}
.sbtn-ussr:hover{background:var(--ussr-mid)}
.sbtn-neu{background:#1a1a1a;color:#ede8dc}
.sbtn-neu:hover{background:#2a2a2a}
.sbtn:disabled{opacity:.35;cursor:not-allowed}
.next-btn{background:#1a1a1a;color:#ede8dc;border:none;border-radius:7px;padding:.78rem 1.4rem;font-family:'Source Serif 4',serif;font-size:.9rem;font-weight:600;cursor:pointer;transition:opacity .2s;width:100%;margin-top:.8rem}
.next-btn:hover{opacity:.85}

/* ── DEBRIEF ── */
.deb-hdr{background:#080808;color:#ede8dc;padding:1.8rem 1.5rem;text-align:center}
.deb-title{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;margin-bottom:.2rem}
.deb-sub{font-size:.8rem;color:#666}
.deb-body{padding:1.4rem;max-width:900px;margin:0 auto}
.deb-q{background:white;border:1px solid var(--border);border-radius:var(--rad);padding:1.1rem 1.3rem;margin-bottom:.9rem}
.deb-qnum{font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:.25rem}
.deb-qtext{font-family:'Playfair Display',serif;font-style:italic;font-size:.98rem;margin-bottom:.65rem;line-height:1.55;color:var(--ink)}
.save-btn{background:#1a1a1a;color:#ede8dc;border:none;border-radius:7px;padding:.8rem 1.8rem;font-family:'Source Serif 4',serif;font-size:.93rem;font-weight:600;cursor:pointer;transition:opacity .2s;display:block;margin:1.4rem auto 0}
.save-btn:hover{opacity:.85}

/* ── PRINT ── */
@media print{
  body{background:white;font-size:10.5pt}
  .sim-hdr,.sbtn,.next-btn,.save-btn,.setup-btn{display:none!important}
  .screen{display:block!important;min-height:unset}
  #printView{display:block!important}
  .pg-break{page-break-before:always}
  textarea,.pta{border:1px solid #bbb!important;min-height:unset!important;height:auto!important;overflow:visible!important;white-space:pre-wrap!important;word-wrap:break-word!important;resize:none!important;background:white!important}
  .intel,.scard,.con-card,.deb-q,.sit-rep,.bg-sec{break-inside:avoid;page-break-inside:avoid}
}

/* ── PRINT VIEW ── */
#printView{display:none;padding:1rem;max-width:800px;margin:0 auto;font-family:'Source Serif 4',Georgia,serif}
.pt-hdr{text-align:center;border-bottom:2px solid #222;padding-bottom:.9rem;margin-bottom:1.4rem}
.pt-title{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:700;color:#111}
.pt-meta{font-size:.8rem;color:#555;margin-top:.25rem}
.pt-sec{margin-bottom:1.4rem}
.pt-sec-title{font-family:'Playfair Display',serif;font-size:.98rem;font-weight:700;border-bottom:1px solid #333;padding-bottom:.25rem;margin-bottom:.65rem;color:#111}
.pt-lbl{font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:#666;margin-bottom:.15rem;margin-top:.5rem}
.pta{width:100%;border:1px solid #bbb;border-radius:3px;padding:.45rem .6rem;font-family:'Source Serif 4',Georgia,serif;font-size:.85rem;min-height:48px;white-space:pre-wrap;word-wrap:break-word;margin-bottom:.6rem;background:#fafafa;color:#111;line-height:1.6}
.pt-dec{background:#f5f5f5;border:1px solid #ccc;border-radius:3px;padding:.4rem .65rem;font-size:.85rem;margin-bottom:.4rem;color:#111}

@media(max-width:600px){
  .img-pair{grid-template-columns:1fr}
  .bg-grid{grid-template-columns:1fr}
  .sit-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ════ SETUP ════ -->
<div class="screen active" id="setupScreen">
  <div class="setup-card">
    <div class="setup-eyebrow">U.S. History · Cold War Unit</div>
    <div class="setup-title">Cuban Missile Crisis</div>
    <div class="setup-subtitle">October 16–28, 1962 · Thirteen Days</div>
    <div class="sf">
      <label>Your Name</label>
      <input type="text" id="sName" placeholder="First and last name">
    </div>
    <div class="sf">
      <label>Select Your Team</label>
      <div class="team-grid">
        <div class="team-opt" id="tUS" onclick="selTeam('US')">
          <div class="team-flag">🇺🇸</div>

<script>
// ══════════════════════════════════════════
// ROLES
// ══════════════════════════════════════════
const ROLES={
  US:[
    {id:'hawk',label:'Gen. Curtis LeMay — Joint Chiefs (Hawk)',short:'Hawk',cls:'rt-hawk',
     desc:'You believe the Soviets only understand force. Air strikes now, before the missiles become operational. Every hour of delay is a gift to Khrushchev. You have no patience for blockades or back channels.'},
    {id:'dove',label:'Robert F. Kennedy — Attorney General (Dove)',short:'Dove',cls:'rt-dove',
     desc:'Your brother is President. A first strike makes the U.S. the aggressor — another Pearl Harbor, but America is Japan. Push hard for the blockade and back-channel negotiation. You believe there is a deal to be made.'},
    {id:'diplomat',label:'Dean Rusk — Secretary of State (Diplomat)',short:'Diplomat',cls:'rt-dip',
     desc:'Every decision ripples through NATO, Latin America, and the UN. You are always asking: how does this look to the world? Alliances take decades to build and one bad decision to destroy.'}
  ],
  USSR:[
    {id:'hardliner',label:'Marshal Malinovsky — Defense Minister (Hardliner)',short:'Hardliner',cls:'rt-hard',
     desc:'The missiles in Cuba are legitimate. The Americans have Jupiters in Turkey pointed at Moscow. You will not blink first. Any sign of weakness will be exploited. Challenge the quarantine.'},
    {id:'pragmatist',label:'Nikita Khrushchev — Premier (Pragmatist)',short:'Pragmatist',cls:'rt-prag',
     desc:'You put the missiles there for two reasons: protect Cuba from another American invasion, and force a deal on Turkey. You don\'t want nuclear war — you want leverage. There is a deal here if the Americans are willing.'},
    {id:'cuba',label:'Anastas Mikoyan — Cuba Liaison',short:'Cuba Advisor',cls:'rt-cuba',
     desc:'You know Castro better than anyone in Moscow. Cuba will not accept being traded away. Soviet credibility across the developing world — Africa, Asia, Latin America — depends on how this ends.'}
  ]
};

// ══════════════════════════════════════════
// ROUND DATA
// ══════════════════════════════════════════
const ROUNDS=[
{
  id:1,title:'Day 1 — The Discovery',date:'October 16, 1962',acting:'US',
  images:{
    acting:[
      {url:'https://upload.wikimedia.org/wikipedia/commons/thumb/d/d8/U2_photo_of_San_Cristobal_missile_site.jpg/800px-U2_photo_of_San_Cristobal_missile_site.jpg',cap:'CIA U-2 photograph of the San Cristóbal missile site, Cuba · October 14, 1962'},
      {url:'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a0/Cuba_crisis_1962.png/800px-Cuba_crisis_1962.png',cap:'Map showing Cuba\'s proximity to the United States — 90 miles from Florida'}
    ],
    reacting:[
      {url:'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a0/Cuba_crisis_1962.png/800px-Cuba_crisis_1962.png',cap:'Strategic position: Cuba, the Caribbean, and Soviet missile range'}
    ]
  },
  actingIntel:`<p>At 8:45 AM this morning, CIA analysts confirmed what U-2 surveillance photographs show: Soviet SS-4 medium-range ballistic missile launch sites are under construction in Cuba — 90 miles from Florida. The missiles are <strong>not yet operational.</strong> CIA estimates 10–14 days until they could be armed and ready to fire.</p>
<p>President Kennedy has convened ExComm in total secrecy. The American public does not know. The Soviets do not know we know. <strong>This window of secrecy may be the most important strategic asset we have right now.</strong></p>
<p>Soviet Ambassador Dobrynin met with the Secretary of State last week and explicitly denied any offensive missiles were going to Cuba. He lied directly to our faces.</p>
<div class="unconf">A small number of CIA analysts believe some sites may be decoys designed to provoke an overreaction and draw attention away from other Soviet actions. This is a minority view not supported by the photographic evidence, but it cannot be entirely dismissed.</div>`,
  reactingIntel:`<p>Soviet intelligence in Washington is reporting unusual activity at the State Department and CIA. U.S. naval movements in the Atlantic have increased sharply in the past 48 hours. U-2 reconnaissance flights over Cuba have intensified to near-daily frequency.</p>
<p><strong>Assessment:</strong> The Americans have almost certainly discovered the missile sites. Construction is ongoing — the missiles are not yet operational, but could be within 10–14 days. Khrushchev's original calculation — that the missiles would be operational before the Americans found them — has failed.</p>
<p>We must decide how to respond before the Americans announce their move. Every hour we wait, their options expand and ours narrow.</p>
<div class="unconf">Our Washington contact reports Kennedy may have already decided on military action and is only waiting for a pretext. This is unconfirmed and may reflect panic rather than intelligence — but cannot be ignored.</div>`,
  actingOptions:[
    {id:'A',label:'Immediate air strikes on all missile sites',desc:'Launch surgical air strikes to destroy the sites before the missiles become operational. Inform NATO allies after the fact. The threat must be eliminated now.'},
    {id:'B',label:'Naval quarantine (blockade)',desc:'Announce a naval quarantine of Cuba — no Soviet ships carrying military equipment may enter. Buy time for diplomacy while demonstrating resolve without firing the first shot.'},
    {id:'C',label:'Private ultimatum to Khrushchev first',desc:'Send a direct back-channel message: the missiles must go. Give him 48 hours to respond before any public action. Preserve the option for a quiet resolution that avoids public humiliation on either side.'},
    {id:'D',label:'Continue surveillance, do not act yet',desc:'The missiles aren\'t operational yet. Wait for more intelligence and more options before committing. Acting on incomplete information could start a war by accident.'}
  ],
  reactingOptions:[
    {id:'A',label:'Accelerate missile installation — work around the clock',desc:'Push construction crews into round-the-clock shifts. Get the missiles operational before the Americans can act. Once operational, the situation changes entirely in our favor.'},
    {id:'B',label:'Send a quiet diplomatic signal to Washington',desc:'Have Ambassador Dobrynin contact Robert Kennedy through the back channel. Signal willingness to discuss — without publicly acknowledging the missiles exist.'},
    {id:'C',label:'Hold position — wait to see what the Americans do',desc:'Make no changes. Observe Kennedy\'s response before committing to any course of action. We do not yet know what they have decided.'},
    {id:'D',label:'Put Soviet Atlantic naval forces on heightened readiness',desc:'Alert submarines and surface ships in the Atlantic. Let the Americans know through action, not words, that the Soviet Union is prepared for whatever they are planning.'}
  ],
  anticipateQ:'Before your team submits, answer: what do you expect the other side to do in response? List at least two possible responses and what consequences each would produce.'
},
{
  id:2,title:'Day 4 — The Quarantine Line',date:'October 24, 1962',acting:'US',
  images:{
    acting:[
      {url:'https://upload.wikimedia.org/wikipedia/commons/thumb/3/39/Cuban_Missile_Crisis_-_US_Navy_vessels.jpg/800px-Cuban_Missile_Crisis_-_US_Navy_vessels.jpg',cap:'U.S. Navy quarantine line map — Soviet ships approaching from the northeast, October 1962'}
    ],
    reacting:[
      {url:'https://upload.wikimedia.org/wikipedia/commons/thumb/0/04/Soviet_ship_Bucharest.jpg/800px-Soviet_ship_Bucharest.jpg',cap:'Soviet cargo ship Bucharest approaching the quarantine line, October 1962'}
    ]
  },
  actingIntel:`<p>Kennedy announced the naval quarantine publicly on October 22nd. The world now knows. Soviet ships — some almost certainly carrying military equipment — are approaching the quarantine line in the Atlantic.</p>
<p>At 10:25 AM, some Soviet ships have stopped dead in the water. Others are still moving toward the line. <strong>The Soviet cargo ship <em>Bucharest</em> is approaching — it appears to carry oil, not weapons.</strong></p>
<p>Secretary McNamara reports that a Soviet submarine is in the area. Standard Navy procedure for forcing a submarine to surface involves dropping practice depth charges — small explosive devices used as a signal, not an attack.</p>
<div class="unconf">Some intelligence suggests the Soviet submarine may be armed with nuclear torpedoes and may have standing orders to fire if attacked. Standard Soviet doctrine requires explicit Kremlin approval for nuclear use — but this submarine has reportedly lost communication with Moscow.</div>`,
  reactingIntel:`<p>Kennedy's quarantine has been announced publicly. Soviet ships carrying military equipment have been ordered to stop or turn back. The cargo ship <em>Bucharest</em> — carrying oil, not weapons — is approaching the quarantine line.</p>
<p>Submarine B-59 is operating in the quarantine zone. It has been running deep to avoid detection and has <strong>lost reliable communication with Moscow.</strong> The crew is under significant stress — heat exceeding 110°F, rising CO2 levels, no news from home about whether war has started.</p>
<p>Khrushchev has received Kennedy's letter but has not yet responded publicly. A decision must be made about the Bucharest — and about B-59.</p>
<div class="unconf">Our submarine commanders may interpret U.S. anti-submarine depth charge activity as a hostile attack rather than a signal. Their standing orders in such a scenario are unclear from Moscow's current position — communications are unreliable.</div>`,
  actingOptions:[
    {id:'A',label:'Stop and board all Soviet ships crossing the line',desc:'The quarantine is real or it isn\'t. Board every ship that crosses, regardless of cargo. Show the Soviets the line means something.'},
    {id:'B',label:'Allow the Bucharest through — it only carries oil',desc:'Let civilian cargo ships pass. Stop only ships carrying military equipment. Avoid a confrontation over petroleum that serves no strategic purpose.'},
    {id:'C',label:'Pause enforcement — give Soviets 24 more hours',desc:'The quarantine is declared but enforcement can wait. Give Khrushchev one more day to respond diplomatically before the first confrontation at sea.'},
    {id:'D',label:'Fire warning shots near the Bucharest',desc:'Demonstrate the quarantine is real without boarding. Warning shots close to the ship send the message while avoiding an actual boarding incident.'}
  ],
  reactingOptions:[
    {id:'A',label:'Order the Bucharest to cross the line',desc:'It carries only oil. Order it to cross and force the Americans to stop a civilian ship in front of the world. Call their bluff publicly.'},
    {id:'B',label:'Turn the Bucharest around',desc:'Avoid a confrontation at sea. Turn back the ship. This is not retreat — it is gaining time while Khrushchev considers his full diplomatic response.'},
    {id:'C',label:'Order submarine B-59 to surface voluntarily',desc:'A voluntary surfacing is a gesture of transparency that reduces the risk of an accidental at-sea encounter and opens a direct channel.'},
    {id:'D',label:'Maintain radio silence — B-59 operates on standing orders',desc:'B-59 has standing orders. The U.S. anti-submarine activity is their choice. What happens next is a consequence of their aggression, not ours.'}
  ],
  anticipateQ:'Before submitting your response, identify: what do you expect the other side to do next, and what are the most dangerous possible consequences of each option?'
},
{
  id:3,title:'Day 11 — Two Letters from Khrushchev',date:'October 26–27, 1962',acting:'USSR',
  images:{
    acting:[
      {url:'https://upload.wikimedia.org/wikipedia/commons/thumb/7/79/Cuban_Missile_Crisis_-_photograph_of_ExCom.jpg/800px-Cuban_Missile_Crisis_-_photograph_of_ExCom.jpg',cap:'ExComm meeting in the Cabinet Room, White House, October 1962 — Kennedy is visible at center'}
    ],
    reacting:[
      {url:'https://upload.wikimedia.org/wikipedia/commons/thumb/4/4a/John_F._Kennedy_-_NARA_-_194603.jpg/800px-John_F._Kennedy_-_NARA_-_194603.jpg',cap:'President Kennedy receiving intelligence cables during the Cuban Missile Crisis, October 1962'}
    ]
  },
  actingIntel:`<p>Khrushchev has drafted two letters to Kennedy. You must decide which one represents the official Soviet position.</p>
<p><strong>Letter One (October 26):</strong> Long, emotional, almost personal. Offers to remove the missiles from Cuba in exchange only for a U.S. pledge not to invade Cuba. The tone is conciliatory — Khrushchev writes that he does not want to "pull the rope of war tighter."</p>
<p><strong>Letter Two (October 27, morning):</strong> Harder in tone. Adds a new public demand: the United States must also remove its Jupiter missiles from Turkey in exchange for Soviet missile removal from Cuba. The Jupiters are aimed at Soviet cities — this demand is publicly defensible.</p>
<div class="unconf">Some Presidium members believe the Turkey demand will be read by Kennedy as Soviet weakness — that we are now bargaining instead of standing firm. This view is contested, but it is held by influential voices.</div><div style="background:#f9f5ec;border:1px solid #c8b870;border-radius:6px;padding:1.1rem 1.3rem;margin:.8rem 0;font-family:'Source Serif 4',Georgia,serif">
<div style="font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:#7a5c00;margin-bottom:.6rem;font-weight:600">Primary Source — Letter One · October 26, 1962 (Khrushchev to Kennedy)</div>
<p style="font-size:.88rem;line-height:1.8;color:#2a2010;margin-bottom:.7rem"><em>"I have received your letter of October 25. I have read it, and am answering you. You are disturbed over Cuba. You say that this disturbs you because it is ninety miles by sea from the coast of the United States of America. But Turkey adjoins us — our sentries patrol back and forth and see each other."</em></p>
<p style="font-size:.88rem;line-height:1.8;color:#2a2010;margin-bottom:.7rem"><em>"If you are really concerned about the peace and welfare of your people — and this is your duty as President — then I, as Chairman of the Council of Ministers, am concerned for my people. Moreover, the Soviet people are not at all willing to experience the horrors of war. We want peace."</em></p>
<p style="font-size:.88rem;line-height:1.8;color:#2a2010"><em>"Let us therefore display statesmanlike wisdom. I propose: we, for our part, will declare that our ships bound for Cuba are not carrying any armaments. You will declare that the United States will not invade Cuba with its troops and will not support any other forces which might intend to invade Cuba. Then the necessity for the presence of our military specialists in Cuba will disappear."</em></p>
<div style="font-size:.72rem;color:#9a7a20;margin-top:.75rem;font-style:italic">Tone: conciliatory, personal, emotional. Single demand: U.S. no-invasion pledge.</div>
</div><div style="background:#f5f0f0;border:1px solid #c87070;border-radius:6px;padding:1.1rem 1.3rem;margin:.8rem 0;font-family:'Source Serif 4',Georgia,serif">
<div style="font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:#7a1010;margin-bottom:.6rem;font-weight:600">Primary Source — Letter Two · October 27, 1962 (Khrushchev to Kennedy)</div>
<p style="font-size:.88rem;line-height:1.8;color:#2a1010;margin-bottom:.7rem"><em>"You are disturbed over Cuba. You say that this disturbs you because it is ninety miles from the coast of the United States. But Turkey is next to us. Our sentinels are pacing and watching each other."</em></p>
<p style="font-size:.88rem;line-height:1.8;color:#2a1010;margin-bottom:.7rem"><em>"I therefore make this proposal: We agree to remove those weapons from Cuba which you regard as offensive weapons. We agree to this and to state this commitment in the United Nations. Your representatives will make a statement to the effect that the United States, on its part, bearing in mind the anxiety and concern of the Soviet state, will evacuate its analogous weapons from Turkey."</em></p>
<p style="font-size:.88rem;line-height:1.8;color:#2a1010"><em>"The Soviet Union will pledge not to invade or interfere with the affairs of Turkey; the United States will pledge not to invade or interfere with the affairs of Cuba. Why then not to make use of these good offices of the Secretary General of the United Nations, U Thant?"</em></p>
<div style="font-size:.72rem;color:#c04040;margin-top:.75rem;font-style:italic">Tone: harder, more formal. New demand: U.S. must also remove Jupiter missiles from Turkey.</div>
</div><div style="background:#fef8e8;border:1px dashed #c8a820;border-radius:4px;padding:.65rem .9rem;margin:.6rem 0;font-size:.83rem;color:#7a5c00;line-height:1.6">
<strong>⚠ Critical uncertainty:</strong> You cannot be certain which letter represents the actual Soviet position. Letter One was sent first. Letter Two came later — diplomatic protocol says respond to the most recent. But some in ExComm believe Letter Two was pushed by hardliners, not Khrushchev himself. Letter One may reflect what Khrushchev actually wants. You must decide which to treat as real.
</div>`,
  reactingIntel:`<p>Khrushchev has sent two contradictory letters. The first (October 26) offers missile removal for a no-invasion pledge only. The second (October 27) adds a new public demand: U.S. Jupiter missiles must come out of Turkey.</p>
<p>ExComm is divided. The second letter is the most recent official Soviet position — diplomatic protocol requires responding to it. But Robert Kennedy has proposed a different approach.</p>
<p><strong>RFK's argument:</strong> Respond only to Letter One. Treat it as the operative Soviet offer. Accept the terms publicly. Handle Turkey separately and privately through a back channel. Ignore the second letter entirely in your public response.</p>
<div class="unconf">Intelligence suggests the Turkey demand in Letter Two was pushed by Soviet hardliners rather than Khrushchev personally, who may privately prefer the simpler Letter One terms. This is unconfirmed — it may be what we want to believe rather than what is true.</div><div style="background:#f9f5ec;border:1px solid #c8b870;border-radius:6px;padding:1.1rem 1.3rem;margin:.8rem 0;font-family:'Source Serif 4',Georgia,serif">
<div style="font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:#7a5c00;margin-bottom:.6rem;font-weight:600">Primary Source — Letter One · October 26, 1962 (Khrushchev to Kennedy)</div>
<p style="font-size:.88rem;line-height:1.8;color:#2a2010;margin-bottom:.7rem"><em>"I have received your letter of October 25. I have read it, and am answering you. You are disturbed over Cuba. You say that this disturbs you because it is ninety miles by sea from the coast of the United States of America. But Turkey adjoins us — our sentries patrol back and forth and see each other."</em></p>
<p style="font-size:.88rem;line-height:1.8;color:#2a2010;margin-bottom:.7rem"><em>"If you are really concerned about the peace and welfare of your people — and this is your duty as President — then I, as Chairman of the Council of Ministers, am concerned for my people. Moreover, the Soviet people are not at all willing to experience the horrors of war. We want peace."</em></p>
<p style="font-size:.88rem;line-height:1.8;color:#2a2010"><em>"Let us therefore display statesmanlike wisdom. I propose: we, for our part, will declare that our ships bound for Cuba are not carrying any armaments. You will declare that the United States will not invade Cuba with its troops and will not support any other forces which might intend to invade Cuba. Then the necessity for the presence of our military specialists in Cuba will disappear."</em></p>
<div style="font-size:.72rem;color:#9a7a20;margin-top:.75rem;font-style:italic">Tone: conciliatory, personal, emotional. Single demand: U.S. no-invasion pledge.</div>
</div><div style="background:#f5f0f0;border:1px solid #c87070;border-radius:6px;padding:1.1rem 1.3rem;margin:.8rem 0;font-family:'Source Serif 4',Georgia,serif">
<div style="font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:#7a1010;margin-bottom:.6rem;font-weight:600">Primary Source — Letter Two · October 27, 1962 (Khrushchev to Kennedy)</div>
<p style="font-size:.88rem;line-height:1.8;color:#2a1010;margin-bottom:.7rem"><em>"You are disturbed over Cuba. You say that this disturbs you because it is ninety miles from the coast of the United States. But Turkey is next to us. Our sentinels are pacing and watching each other."</em></p>
<p style="font-size:.88rem;line-height:1.8;color:#2a1010;margin-bottom:.7rem"><em>"I therefore make this proposal: We agree to remove those weapons from Cuba which you regard as offensive weapons. We agree to this and to state this commitment in the United Nations. Your representatives will make a statement to the effect that the United States, on its part, bearing in mind the anxiety and concern of the Soviet state, will evacuate its analogous weapons from Turkey."</em></p>
<p style="font-size:.88rem;line-height:1.8;color:#2a1010"><em>"The Soviet Union will pledge not to invade or interfere with the affairs of Turkey; the United States will pledge not to invade or interfere with the affairs of Cuba. Why then not to make use of these good offices of the Secretary General of the United Nations, U Thant?"</em></p>
<div style="font-size:.72rem;color:#c04040;margin-top:.75rem;font-style:italic">Tone: harder, more formal. New demand: U.S. must also remove Jupiter missiles from Turkey.</div>
</div><div style="background:#fef8e8;border:1px dashed #c8a820;border-radius:4px;padding:.65rem .9rem;margin:.6rem 0;font-size:.83rem;color:#7a5c00;line-height:1.6">
<strong>⚠ Critical uncertainty:</strong> You cannot be certain which letter represents the actual Soviet position. Letter One was sent first. Letter Two came later — diplomatic protocol says respond to the most recent. But some in ExComm believe Letter Two was pushed by hardliners, not Khrushchev himself. Letter One may reflect what Khrushchev actually wants. You must decide which to treat as real.
</div>`,
  actingOptions:[
    {id:'A',label:'Stand firm on Letter Two — Cuba deal AND Turkey deal',desc:'The Jupiter missiles in Turkey are aimed at Moscow. This reciprocal demand is publicly defensible. Both withdrawals must be part of any agreement.'},
    {id:'B',label:'Withdraw Letter Two — offer only the terms of Letter One',desc:'The Turkey demand makes everything impossible for Kennedy to accept publicly. Withdraw it. Offer only the no-invasion pledge for missile removal.'},
    {id:'C',label:'Take the Turkey demand public at the United Nations',desc:'Bring the demand to the UN Security Council. Force Kennedy to respond publicly in front of the world. International pressure changes the calculation.'},
    {id:'D',label:'Issue a harder third letter — full U.S. withdrawal from Caribbean',desc:'Letters One and Two were too conciliatory. Issue a third, harder position. The Soviet Union will not be pressured by an American naval display.'}
  ],
  reactingOptions:[
    {id:'A',label:'Respond to Letter Two — negotiate privately on Turkey',desc:'The Turkey demand is not unreasonable — the Jupiters are obsolete anyway. Open secret negotiations: missiles out of Cuba, Jupiters out of Turkey within 6 months, kept quiet.'},
    {id:'B',label:'Respond to Letter One only — ignore Turkey (RFK\'s gambit)',desc:'Treat Letter One as the operative Soviet offer. Accept publicly: no-invasion pledge for missile removal. Do not acknowledge Turkey in the public response. Handle it separately.'},
    {id:'C',label:'Reject both letters — demand immediate unconditional removal',desc:'The U.S. will not negotiate the removal of missiles that should never have been placed there. Unconditional removal first. Discussion of terms afterward.'},
    {id:'D',label:'Take the question to the UN Security Council',desc:'Let U Thant mediate. Remove the direct superpower confrontation from center stage and build international pressure while both sides gain time.'}
  ],
  anticipateQ:'Before submitting, identify: how do you expect the other side to respond to each possible decision? Which of their possible responses would be most dangerous to your position?'
},
{
  id:4,title:'Day 12 — The U-2 is Shot Down',date:'October 27, 1962',acting:'USSR',
  images:{
    acting:[
      {url:'https://upload.wikimedia.org/wikipedia/commons/thumb/d/d2/Rudolf_Anderson.jpg/400px-Rudolf_Anderson.jpg',cap:'Major Rudolf Anderson, USAF — killed when his U-2 was shot down over Cuba, October 27, 1962'},
      {url:'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e5/U-2_wreckage_in_Cuba.jpg/800px-U-2_wreckage_in_Cuba.jpg',cap:'Wreckage of Major Anderson\'s U-2 aircraft, Cuba — displayed publicly by the Cuban government'}
    ],
    reacting:[
      {url:'https://upload.wikimedia.org/wikipedia/commons/thumb/d/d2/Rudolf_Anderson.jpg/400px-Rudolf_Anderson.jpg',cap:'Major Rudolf Anderson — the first American combat casualty of the Cuban Missile Crisis'}
    ]
  },
  actingIntel:`<p>A U.S. U-2 reconnaissance aircraft flying over Cuba has been shot down by a Soviet SA-2 surface-to-air missile battery. The American pilot, Major Rudolf Anderson, is dead.</p>
<p><strong>Moscow did not order this.</strong> Cuban anti-aircraft crews — under nominal Soviet command — fired the missiles without authorization from Khrushchev. Castro had been pressuring Soviet local commanders to respond to U.S. overflights for days.</p>
<p>The Americans do not yet know that Moscow didn't order it. They know only that a Soviet missile system killed an American military pilot over Cuba.</p>
<div class="unconf">Our assessment is that Kennedy faces overwhelming pressure from the Joint Chiefs to retaliate militarily within 24 hours. This is a reasonable assessment — but Kennedy has surprised us before. He may have more room than we think to hold his military back.</div>`,
  reactingIntel:`<p>Major Rudolf Anderson's U-2 has been shot down over Cuba. He is dead. The Joint Chiefs are in the room with the President right now. General LeMay is arguing this is exactly what he predicted — Soviet forces have fired on an American military aircraft in international airspace. Military protocol calls for immediate retaliatory air strikes on the missile batteries that fired.</p>
<p>Kennedy has approximately 24 hours before the military pressure becomes impossible to resist politically and institutionally.</p>
<div class="unconf">A minority assessment within the CIA suggests the shoot-down was ordered by Cuban commanders independently, not the Soviet Presidium — that Khrushchev may not have authorized this action. This would change the calculus significantly. But the consensus view is that any Soviet military equipment in Cuba operates under Kremlin authority, and the distinction may not matter politically.</div>`,
  actingOptions:[
    {id:'A',label:'Claim responsibility — warn that further overflights will be met with force',desc:'If Moscow doesn\'t claim it, Cuba gets credit and the Soviets appear unable to control their own forces. Take responsibility. Make clear the quarantine zone is defended.'},
    {id:'B',label:'Deny Soviet involvement — explain Cuban forces acted without orders',desc:'Tell Kennedy the truth: Moscow did not authorize this action. Cuban forces acted independently. This should not trigger a Soviet-American military exchange.'},
    {id:'C',label:'Say nothing — make no statement',desc:'Any statement carries risk. Silence lets Kennedy draw his own conclusions and forces him to make the next move without Soviet direction.'},
    {id:'D',label:'Use the shoot-down as bargaining leverage',desc:'The incident has handed the Soviets a powerful position. Offer to prevent further incidents in exchange for ending the quarantine and beginning negotiations.'}
  ],
  reactingOptions:[
    {id:'A',label:'Authorize retaliatory air strikes on the missile batteries',desc:'An American is dead. Soviet forces shot him down. Military protocol is clear. Strike the batteries that fired within 24 hours.'},

{
  id:6,title:'Day 13 — The Back-Channel Deal',date:'October 28, 1962',acting:'US',
  images:{
    acting:[
      {url:'https://upload.wikimedia.org/wikipedia/commons/thumb/6/6d/JFK_and_RFK_1963.jpg/800px-JFK_and_RFK_1963.jpg',cap:'President Kennedy and Attorney General Robert Kennedy — RFK was Kennedy\'s most trusted advisor and conducted the back-channel negotiations with Soviet Ambassador Dobrynin'}
    ],
    reacting:[
      {url:'https://upload.wikimedia.org/wikipedia/commons/thumb/6/6d/JFK_and_RFK_1963.jpg/800px-JFK_and_RFK_1963.jpg',cap:'Robert Kennedy met secretly with Soviet Ambassador Anatoly Dobrynin on the night of October 27, 1962'}
    ]
  },
  actingIntel:`<p>Robert Kennedy met with Soviet Ambassador Anatoly Dobrynin last night. A framework exists.</p>
<p><strong>Public terms:</strong> The Soviet Union removes its missiles from Cuba. The United States publicly pledges not to invade Cuba.</p>
<p><strong>Private terms:</strong> The United States will remove its Jupiter missiles from Turkey within six months. <strong>This part of the deal must never be made public.</strong> If it leaks, the deal collapses and Kennedy looks like he negotiated under duress.</p>
<p>This is the offer. If Kennedy rejects it, there may not be another — and the military has a strike plan ready to execute within 24 hours.</p>
<div class="unconf">Several hawks in ExComm believe Khrushchev will accept a deal even without the Turkey commitment if the U.S. holds firm — that he is more desperate than he appears. This view is not supported by what Dobrynin communicated privately, but it is held with conviction by significant voices in the room.</div>`,
  reactingIntel:`<p>Robert Kennedy met with Dobrynin last night. The Americans have offered to remove the Jupiter missiles from Turkey — privately, within six months — in exchange for Soviet missile removal from Cuba and a U.S. no-invasion pledge.</p>
<p>This is more than Khrushchev's first letter asked for. It is a genuine American concession.</p>
<p><strong>The problem:</strong> Accepting this deal means removing the missiles from Cuban soil without a public commitment from the United States that the world can see. The Soviet military will read this as capitulation. Castro will feel abandoned. And the Turkey commitment, being secret, cannot be shown to anyone as evidence of Soviet success.</p>
<div class="unconf">Our Havana contact reports Castro is furious and may take unilateral military action — possibly against the U.S. naval base at Guantanamo — if the missiles are removed without his formal agreement. This may be bluster, but Castro has surprised us before.</div>`,
  actingOptions:[
    {id:'A',label:'Accept the full deal — public pledge plus private Turkey commitment',desc:'This ends the crisis. The Jupiters are obsolete anyway and already scheduled for review. Accept, keep the Turkey part quiet, and declare it a victory for American resolve.'},
    {id:'B',label:'Accept the public terms only — no Turkey commitment',desc:'The U.S. will not make secret commitments under duress. Accept the no-invasion pledge in exchange for missile removal, but take Turkey entirely off the table.'},
    {id:'C',label:'Accept but require UN verification of Soviet missile removal first',desc:'Before committing to anything, require verified Soviet missile removal under UN supervision. Trust but verify — publicly and verifiably.'},
    {id:'D',label:'Reject the deal — issue a final ultimatum and prepare strikes',desc:'Thirteen days is enough. The missiles must come out unconditionally and immediately. Issue a final 24-hour ultimatum and execute the military option.'}
  ],
  reactingOptions:[
    {id:'A',label:'Accept the deal — missiles out, Turkey commitment kept private',desc:'This is a genuine win: Cuba protected from invasion, the Jupiter missiles coming out, the crisis ending. Accept.'},
    {id:'B',label:'Accept missile removal but demand Turkey be made public',desc:'The Soviet people and military need to see a tangible achievement. The Turkey commitment must be acknowledged publicly or it has no political value at home.'},
    {id:'C',label:'Reject the deal — demand a formal public treaty with verification',desc:'A back-channel promise from the Attorney General is not sufficient. Demand a formal, verifiable, publicly acknowledged agreement.'},
    {id:'D',label:'Accept the deal but require Castro\'s agreement first',desc:'Removing missiles from Cuban soil without Cuba\'s formal consent destroys Soviet credibility across the developing world. Castro must agree.'}
  ],
  anticipateQ:'Before submitting, identify: what is the best-case outcome if the other side accepts your terms? What is the worst-case outcome if they refuse?'
}
];

  1:{'A-A':{t:'U.S. air strikes hit the sites while Soviet crews are still working. 28 Soviet personnel are killed. Khrushchev announces this is an act of war. Soviet submarines in the Atlantic receive authorization for nuclear torpedoes if attacked.',e:9,c:'bad'},'A-B':{t:'U.S. launches strikes. A Soviet diplomatic signal reaches American officials hours later — too late. The bombs are already falling. Khrushchev\'s conciliatory back channel becomes irrelevant. Soviet hardliners seize control of the response.',e:9,c:'bad'},'A-C':{t:'U.S. strikes with no warning while the Soviets hold position waiting for the American move. No back channel existed. The world watches as both superpowers move toward direct military confrontation.',e:9,c:'bad'},'A-D':{t:'U.S. strikes. Soviet submarines, now on combat readiness and cut off from Moscow, detect the attack. One submarine captain requests nuclear torpedo authorization from his three-officer committee.',e:8,c:'bad'},'B-A':{t:'Kennedy announces a quarantine. Soviet construction crews race to finish the sites. A cargo ship loaded with missiles approaches the quarantine line. Both sides have committed to positions. The world holds its breath.',e:7,c:'neu'},'B-B':{t:'Kennedy announces a quarantine. Simultaneously, a quiet Soviet diplomatic signal reaches the White House — Khrushchev wants a private channel. A potential path toward resolution exists, narrow but real.',e:5,c:'good'},'B-C':{t:'Kennedy announces a quarantine. The Soviets hold position with no dramatic response. Soviet ships continue toward the quarantine line. Neither side has blinked.',e:7,c:'neu'},'B-D':{t:'Kennedy announces a quarantine. Soviet submarines are positioned near the quarantine line on heightened alert. U.S. destroyers begin tracking them. An encounter at sea becomes increasingly likely.',e:7,c:'neu'},'C-A':{t:'U.S. sends a private ultimatum. Soviet crews accelerate construction. Khrushchev reads the quiet signal as hesitation — the Americans are blinking. He pushes harder.',e:8,c:'bad'},'C-B':{t:'U.S. sends a private warning. Soviets send a quiet diplomatic signal back. A tentative back channel opens. No public commitment exists on either side — the crisis is live, but a thread of communication exists.',e:5,c:'good'},'C-C':{t:'Both sides watch in silence. Intelligence agencies on both sides are working overtime. The missiles move closer to operational every hour. The window for non-military solutions narrows.',e:7,c:'neu'},'C-D':{t:'U.S. sends a quiet warning while Soviet naval forces quietly mobilize. Soviet commanders interpret the naval activity as preparation for invasion. Tensions rise on both sides simultaneously.',e:8,c:'neu'},'D-A':{t:'The U.S. waits. Soviet crews complete installation of the first operational missile — now pointed at Washington. ExComm is alarmed. The window for air strikes has narrowed dramatically.',e:8,c:'bad'},'D-B':{t:'The U.S. waits. Soviets send a quiet diplomatic overture. Kennedy reads this as an opening — but the missiles are closer to operational every hour.',e:6,c:'neu'},'D-C':{t:'Both sides wait. Nothing happens. Missiles continue being installed. Intelligence estimates three days until the first site is fully operational. The window is closing.',e:7,c:'neu'},'D-D':{t:'Both sides wait. Soviet ships continue toward Cuba. Missiles continue being installed. The situation grows increasingly unstable with no path to resolution visible on either side.',e:7,c:'neu'}},
  2:{'A-A':{t:'U.S. moves to board the Bucharest. It crosses the line. American sailors attempt to board; Soviet sailors physically resist. A confrontation erupts at sea. Submarine B-59, in the area, receives sonar signals its commander interprets as the start of hostilities.',e:9,c:'bad'},'A-B':{t:'The Bucharest turns back. U.S. forces prepare to board the next ship in line — which carries military equipment. The Soviets have blinked once. The confrontation is not over but the immediate crisis has been avoided.',e:6,c:'neu'},'A-C':{t:'A Soviet submarine surfaces voluntarily near the quarantine line. U.S. destroyers immediately surround it. The submarine commander, now in contact with fleet command, receives new orders: hold position. An uneasy standoff, but communication is open.',e:5,c:'good'},'A-D':{t:'U.S. insists on boarding. Submarine B-59 is operating on standing orders. U.S. anti-submarine depth charges are increasingly aggressive. The submarine captain concludes he is under attack.',e:9,c:'bad'},'B-A':{t:'The U.S. lets the Bucharest pass. Soviets read this as weakness and order the next ship — carrying military equipment — to follow. More ships follow. The quarantine\'s credibility is collapsing.',e:8,c:'bad'},'B-B':{t:'The U.S. allows the oil ship through. The Soviets turn the Bucharest around voluntarily. Both sides have avoided a direct confrontation at sea. The quarantine holds without incident. A small but real moment of de-escalation.',e:4,c:'good'},'B-C':{t:'The U.S. lets the oil ship pass. A Soviet submarine surfaces nearby — a voluntary gesture of transparency. Back-channel conversations begin cautiously.',e:4,c:'good'},'B-D':{t:'U.S. lets the oil ship pass. Submarine B-59 remains submerged on standing orders near a U.S. destroyer. U.S. anti-submarine forces drop practice depth charges to force surfacing. The submarine commander does not know if this is an attack.',e:8,c:'bad'},'C-A':{t:'U.S. pauses enforcement. Soviets immediately order the Bucharest to cross. More ships follow. The quarantine has effectively been broken before negotiations have even begun.',e:9,c:'bad'},'C-B':{t:'U.S. pauses. Soviets turn back their ships. Both sides gain time. The missiles remain in Cuba, but the immediate crisis at sea has been avoided. Kennedy and Khrushchev have a window.',e:5,c:'good'},'C-C':{t:'U.S. pauses. Soviets surface a submarine. A tense but stable standoff develops. Neither side has escalated. Both sides are watching each other very carefully.',e:5,c:'neu'},'C-D':{t:'U.S. pauses. Submarine B-59 remains on standing orders in radio silence. U.S. destroyers continue tracking it. Without communication, both sides are operating on assumptions — the most dangerous condition in the crisis.',e:8,c:'bad'},'D-A':{t:'Warning shots fired near the Bucharest. It crosses the line anyway. The Soviet crew radios Moscow: the Americans fired on us. Khrushchev\'s hardliners gain significant ground.',e:8,c:'bad'},'D-B':{t:'Warning shots fired. The Bucharest turns back. Soviet leadership reads the warning as firm but measured — not an attack. Khrushchev begins drafting a conciliatory response.',e:5,c:'good'},'D-C':{t:'Warning shots fired. A Soviet submarine surfaces nearby — possibly as a de-escalation gesture, possibly interpreting the shots as hostility. U.S. commanders are uncertain. Tense standoff at sea.',e:6,c:'neu'},'D-D':{t:'Warning shots fired. Submarine B-59, on standing orders and cut off from Moscow, detects the activity as a potential attack. The captain calls a meeting of his three-officer nuclear authorization committee. One vote could determine whether civilization survives this night.',e:9,c:'bad'}},
  3:{'A-A':{t:'Both sides acknowledge Turkey as part of the framework. Secret negotiations begin. Kennedy privately commits: Jupiters out of Turkey within 6 months, quietly. The deal framework exists — but it must remain secret or domestic politics will destroy it on both sides.',e:3,c:'good'},'A-B':{t:'Soviets hold firm on Turkey. U.S. responds to the soft letter only, ignoring Turkey publicly. Khrushchev reads this as bad faith. Soviet hardliners gain influence in the Presidium.',e:7,c:'neu'},'A-C':{t:'Soviets demand Turkey. U.S. demands unconditional removal. Public standoff with no face-saving exit for either leader. NATO allies are alarmed. The UN is scrambling.',e:8,c:'bad'},'A-D':{t:'Turkey demand made. U.S. takes to UN. U Thant proposes a temporary freeze. Both sides agree to pause while he mediates. The missiles remain in Cuba.',e:5,c:'neu'},'B-A':{t:'Soviets withdraw Turkey demand. U.S. engages on Turkey privately anyway. Khrushchev is surprised — Kennedy is offering more than he asked for in Letter One. A resolution is coming into view.',e:3,c:'good'},'B-B':{t:'Soviets offer a clean deal. U.S. responds to the soft letter only. Both sides are aligned on the basic framework. Robert Kennedy meets Dobrynin privately tonight. The deal is close.',e:2,c:'good'},'B-C':{t:'Soviets offer clean deal. U.S. demands unconditional removal. Khrushchev extended an olive branch and it was rejected. Soviet hardliners argue this proves the Americans want humiliation, not resolution.',e:8,c:'bad'},'B-D':{t:'Soviets offer clean deal. U.S. takes to UN. Negotiations slow but remain open. Both sides are still talking.',e:5,c:'neu'},'C-A':{t:'Soviets make Turkey demand public. U.S. negotiates Turkey privately. Public pressure is enormous — NATO allies demand consultation, West Germany is alarmed. The deal becomes politically toxic even as it progresses.',e:7,c:'neu'},'C-B':{t:'Soviets make Turkey demand public. U.S. responds to soft letter, ignoring Turkey publicly. The contradiction is visible to the world. Kennedy appears to be ignoring a reasonable reciprocal offer.',e:7,c:'neu'},'C-C':{t:'Full public standoff. Both sides at maximum public demands with no face-saving exit. UN Security Council in emergency session. The situation is at maximum danger.',e:9,c:'bad'},'C-D':{t:'Soviets make Turkey demand public. U.S. takes to UN. Both sides arguing through a third party while the missiles remain operational in Cuba.',e:6,c:'neu'},'D-A':{t:'Soviet position hardens maximally. U.S. offers to negotiate on Turkey. But Soviet demands have become so extreme that the American offer feels like a trap to Presidium hardliners.',e:8,c:'bad'},'D-B':{t:'Soviets harden. U.S. responds to an earlier conciliatory signal and ignores the hard position. Neither side knows what the other actually wants. Dangerous confusion at the highest levels.',e:7,c:'neu'},'D-C':{t:'Both sides hardened to maximalist positions. No negotiating room remains. Military options are now the primary topic in both capitals.',e:9,c:'bad'},'D-D':{t:'Soviets harden. U.S. takes to UN. The UN process cannot move fast enough. Missiles are operational and military pressure on Kennedy is overwhelming.',e:8,c:'bad'}},
  4:{'A-A':{t:'Soviets claim responsibility. Americans retaliate with air strikes on the missile batteries. Soviet forces in Cuba return fire. Three Americans are killed. Kennedy convenes a war council. The Joint Chiefs are unanimous: this is war.',e:10,c:'bad'},'A-B':{t:'Soviets claim responsibility. Kennedy, under enormous military pressure, chooses not to retaliate. His restraint is extraordinary. But the situation is at maximum tension — the next incident may trigger automatic escalation.',e:8,c:'neu'},'A-C':{t:'Soviets claim responsibility. Kennedy demands an explanation. The Soviet answer — we did it and we will do it again — removes any remaining path to negotiation.',e:9,c:'bad'},'A-D':{t:'Soviets claim responsibility but offer a deal. Kennedy reads this as cynical maneuvering over an American\'s death. Any remaining goodwill is gone.',e:8,c:'bad'},'B-A':{t:'Soviets deny involvement. Americans retaliate anyway. Air strikes hit the batteries. A Soviet technician is killed. Khrushchev sends an emergency message: this is the edge of the abyss.',e:9,c:'bad'},'B-B':{t:'Soviets explain Cuban forces acted without orders. Kennedy chooses to believe it — or acts as if he does. He tells ExComm: "We are not going to war over a miscommunication." The path to negotiation reopens.',e:4,c:'good'},'B-C':{t:'Soviets deny ordering it. Kennedy demands clarification. The explanation — Cuban commanders acted independently — cannot be fully verified but buys critical hours.',e:5,c:'neu'},'B-D':{t:'Soviets deny involvement. Kennedy suspends U-2 flights and calls for talks. Moscow reads this as a significant concession. Khrushchev has room to offer a deal.',e:3,c:'good'},'C-A':{t:'Soviets say nothing. Americans strike. Silence reads as confirmation. Strikes hit four battery sites. Soviet forces in Cuba go to full combat readiness.',e:9,c:'bad'},'C-B':{t:'Soviets silent. Kennedy holds and doesn\'t retaliate. The silence is agonizing but Kennedy reads it as an opening — if the Soviets wanted war they would have said so. RFK meets Dobrynin tonight.',e:5,c:'neu'},'C-C':{t:'Neither side speaks. Absolute maximum tension. Deep below the Atlantic, submarine B-59 has just received practice depth charges from U.S. destroyers.',e:9,c:'bad'},'C-D':{t:'Soviets silent. U.S. suspends overflights and calls for talks. The unilateral American concession after an American\'s death is remarkable. Moscow reads it as Kennedy genuinely wanting an exit.',e:4,c:'good'},'D-A':{t:'Soviets try to use the shoot-down as bargaining leverage. Americans retaliate. Bargaining over an American\'s death infuriates Kennedy. All remaining goodwill is gone.',e:9,c:'bad'},'D-B':{t:'Soviets offer a deal. Kennedy absorbs the incident without retaliation. Soviet flexibility and American restraint in the same moment — the most significant diplomatic opening of the entire crisis.',e:3,c:'good'},'D-C':{t:'Soviets offer a deal. Kennedy demands an explanation first. The Soviet offer remains on the table while both sides communicate. A framework may be possible.',e:5,c:'neu'},'D-D':{t:'Soviets offer a deal. Kennedy suspends U-2 flights. Both sides have made unilateral concessions simultaneously. For the first time in 12 days, the direction is clearly toward resolution.',e:2,c:'good'}},
  6:{'A-A':{t:'The deal is done. Soviet missiles leave Cuba under UN inspection. The U.S. pledges not to invade. The Jupiter missiles come quietly out of Turkey six months later — the world never learns of that part. Kennedy is celebrated. Khrushchev is seen in the West as having blinked — but he kept his country out of nuclear war, protected Cuba from invasion, and got Turkey. The Cuban Missile Crisis is over.',e:1,c:'good'},'A-B':{t:'U.S. accepts privately. Soviets make the Turkey deal public. Kennedy is furious — it looks like he traded American security commitments for the removal of missiles that should never have been placed there. Domestic political damage is severe. But the crisis ends.',e:3,c:'neu'},'A-C':{t:'U.S. offers full deal. Soviets demand a formal public treaty. Negotiations extend three more days while lawyers draft language. Missiles remain in Cuba during this time.',e:5,c:'neu'},'A-D':{t:'U.S. accepts the full deal. Soviets require Castro\'s agreement. Castro refuses — he never wanted the missiles removed; they were Cuba\'s deterrent against invasion. The deal collapses. Both superpowers face a Cuban veto.',e:7,c:'bad'},'B-A':{t:'U.S. refuses Turkey commitment. Soviets accept the deal anyway. Khrushchev calculates that the no-invasion pledge alone justifies missile removal. Crisis ends — but Khrushchev\'s domestic standing collapses. He is removed from power in 1964, partly because he "gave away" the Cuba advantage.',e:3,c:'neu'},'B-B':{t:'U.S. refuses Turkey. Soviets demand it be made public. Complete impasse. Neither side has a face-saving exit. Military options return to the table.',e:8,c:'bad'},'B-C':{t:'U.S. refuses Turkey. Soviets demand formal treaty. Negotiations collapse. The crisis continues.',e:8,c:'bad'},'B-D':{t:'U.S. refuses Turkey. Soviets require Castro\'s agreement. Castro demands guarantees the U.S. won\'t give. Three-way deadlock.',e:7,c:'bad'},'C-A':{t:'U.S. requires UN verification first. Soviets accept. U Thant oversees missile removal. Turkey deal happens quietly afterward. Crisis resolved through multilateral framework — slower but verifiable and durable.',e:2,c:'good'},'C-B':{t:'U.S. requires verification. Soviets demand Turkey be made public. Kennedy refuses public humiliation. The deal falls apart over who gets credit for ending it.',e:7,c:'bad'},'C-C':{t:'Both sides demand verification and formal treaties. Lawyers drafting on both sides. Missiles remain in Cuba for another week. Eventually resolved — slowly.',e:4,c:'neu'},'C-D':{t:'U.S. demands UN inspection. Soviets require Castro\'s agreement. Castro refuses inspection. Three-way deadlock.',e:7,c:'bad'},'D-A':{t:'U.S. prepares military action. Soviets unilaterally announce missile removal before strikes begin. Kennedy is stunned — they capitulated without the Turkey commitment. He calls off the strikes. Crisis ends, but Kennedy is left wondering what just happened.',e:4,c:'neu'},'D-B':{t:'U.S. prepares strikes. Soviets demand Turkey be made public before removing missiles. Kennedy refuses. Air strikes hit missile sites. Soviet technicians are killed. Khrushchev authorizes military response.',e:10,c:'bad'},'D-C':{t:'U.S. prepares strikes. Soviets demand a formal treaty. Kennedy\'s final ultimatum: 24 hours. No diplomatic channel is open on either side.',e:10,c:'bad'},'D-D':{t:'U.S. strikes Cuba. The Soviet Union authorizes full military response. Nuclear weapons are authorized for use by both sides. The simulation cannot continue from here.',e:10,c:'bad'}}

function rndrRound(rd){
  const isAct=S.team===rd.acting;
  let html=`<div class="rnd-head"><div class="rnd-num">Round ${rd.id} of 6</div><div class="rnd-title">${rd.title}</div><div class="rnd-date">${rd.date}</div></div>`;

  if(S.phase==='bg') return html+rndrBg();

  // Images
  const imgs=isAct?rd.images.acting:rd.images.reacting;
  if(imgs&&imgs.length===1){
    html+=`<div class="img-panel"><img src="${imgs[0].url}" alt="historical photo" onerror="this.style.display='none'"><div class="img-caption">${imgs[0].cap}</div></div>`;
  } else if(imgs&&imgs.length>=2){
    html+=`<div class="img-pair">`;
    imgs.forEach(im=>{html+=`<div class="img-panel"><img src="${im.url}" alt="historical photo" onerror="this.style.display='none'"><div class="img-caption">${im.cap}</div></div>`;});
    html+=`</div>`;
  }

  // Determine what THIS device should show based on locally saved data
  const actDecSaved  = gr('r'+rd.id+'_act_dec');
  const reactDecSaved = gr('r'+rd.id+'_react_dec');
  const inConfirm = gr('r'+rd.id+'_in_confirm');
  // Resolve branching options based on prior round decisions
  var branchOpts = getBranchingOptions(rd);
  rd._actOpts = branchOpts.acting;
  rd._reactOpts = branchOpts.reacting;

  if(reactDecSaved){
    // Both decisions confirmed — show consequence
    html += rndrCon(rd);
  } else if(actDecSaved || inConfirm){
    // Acting team submitted OR reacting team clicked they announced
    // Show the two-section confirm screen
    html += rndrConfirm(rd, isAct);
  } else {
    // Acting team still deliberating
    html += isAct ? rndrActing(rd) : rndrWaitAct(rd);
  }
  return html;
}

function rndrActing(rd){
  const ro=(ROLES[S.team]||[]).find(r=>r.id===S.role);

  const jstK=`r${rd.id}_act_jst`;

  const myLabel=S.team==='US'?'🇺🇸 U.S. ExComm — your decisions':'☭ Soviet Presidium — your decisions';

  html+=`<div class="intel int-${myTeam}"><div class="intel-eye">${S.team==='US'?'CIA / ExComm Intelligence Briefing':'KGB / Presidium Intelligence Briefing'}</div>${getActingIntel(rd)}</div>`;

  if(ro) html+=`<div class="scard"><div class="scard-eye">Your role</div><span class="rtag ${ro.cls}">${ro.label}</span><p style="font-size:.88rem;color:var(--ink-mid);line-height:1.65">${ro.desc}</p></div>`;

  html+=`<div class="scard"><h3>Step 1 — Your Individual Reasoning</h3>
    <label class="flabel">What do you argue for in the room? Write from your role's perspective.</label>
    <textarea placeholder="What would ${ro?ro.short:'your character'} advocate for, and why?" oninput="sr('${rsnK}',this.value)">${gr(rsnK)}</textarea>
    <div class="fnote">This is your individual work — your teammates write their own reasoning on their own devices. <strong>Minimum 30 characters to count as complete.</strong></div>
  </div>`;

  // Decision section — both teams' options shown
  html+=`<div class="scard"><h3>Step 2 — Decisions</h3>
    <p style="font-size:.84rem;color:var(--ink-mid);margin-bottom:.85rem;line-height:1.6">Discuss with your team and agree on a decision. Each person enters the agreed decision below. The other side's options are shown for reference — they are locked until after you announce your choice.</p>`;

  // YOUR options (selectable)
  html+=`<div class="dec-section"><div class="dec-section-title dec-title-${myTeam}">${myLabel}</div><div class="dec-opts">`;
  rd._actOpts.forEach(opt=>{
    const saved=gr(decK);
    const sel=saved===opt.id?` sel-${myTeam}`:'';
    html+=`<div class="dec-opt${S.team==='USSR'?' ussr-r':''}${sel}" onclick="pickDec('${decK}','${opt.id}',this,'${myTeam}')">
      <input type="radio" name="adec_${rd.id}" value="${opt.id}" ${saved===opt.id?'checked':''}>
      <div class="dec-lbl"><strong>${opt.label}</strong><br>${opt.desc}</div>
    </div>`;
  });
  html+=`</div></div>`;

  // OPPONENT options (locked/display only)
  const oppOptions=rd._reactOpts;
  html+=`<div class="dec-section" style="margin-top:.75rem"><div class="dec-section-title dec-title-locked-${oppTeam}">${oppLabel} — <span style="font-weight:400;font-size:.7rem;letter-spacing:0">locked until you announce your decision</span></div><div class="dec-opts">
    <div class="locked-note">These are the options available to the other side. Study them while you deliberate — anticipating their possible responses is part of good decision-making. They will be unlocked after you announce your decision.</div>`;
  oppOptions.forEach(opt=>{
    html+=`<div class="dec-opt locked-opt">
      <span class="lock-icon">🔒</span>
      <div class="dec-lbl"><strong>${opt.label}</strong><br>${opt.desc}</div>
    </div>`;
  });
  html+=`</div></div></div>`;

  html+=`<div class="scard"><h3>Step 3 — Anticipated Responses &amp; Consequences</h3>
    <label class="flabel">${rd.anticipateQ}</label>
    <textarea rows="4" placeholder="List at least two possible responses from the other side. For each, explain what you think would happen. This is how real decision-makers think." oninput="sr('${antK}',this.value)">${gr(antK)}</textarea>
    <div class="fnote"><strong>Minimum 30 characters.</strong></div>
    <div class="fnote"><strong>Minimum 30 characters.</strong></div>
  </div>`;

  html+=`<div class="scard"><h3>Step 4 — Team Justification</h3>
    <label class="flabel">As a team, explain your decision. What drove it? What were you afraid of? What were you hoping to achieve?</label>
    <textarea rows="4" placeholder="Your team's collective justification. Each team member enters this on their own device." oninput="sr('${jstK}',this.value)">${gr(jstK)}</textarea>
    <div class="fnote"><strong>Minimum 30 characters.</strong></div>
    <div class="fnote"><strong>Minimum 30 characters.</strong></div>
  </div>`;

  html+=`<button class="sbtn sbtn-${myTeam}" onclick="submitAct('${decK}')">Submit &amp; Announce Decision to the Room</button>`;
  return html;
}

  const actLabel=rd.acting==='US'?'🇺🇸 U.S. ExComm is deliberating':'☭ Soviet Presidium is deliberating';

// ══════════════════════════════════════════
// CONFIRM PHASE — reacting team clicks acting team's announced decision
// ══════════════════════════════════════════
function rndrConfirm(rd, isAct){
  const myTeam=S.team==='US'?'us':'ussr';
  const oppTeam=S.team==='US'?'ussr':'us';
  const actDecK='r'+rd.id+'_act_dec';
  const reactDecK='r'+rd.id+'_react_dec';
  const confirmedActDec=gr(actDecK);
  const confirmedReactDec=gr(reactDecK);
  const actTeamName=rd.acting==='US'?'U.S. ExComm':'Soviet Presidium';
  const reactTeamName=rd.acting==='US'?'Soviet Presidium':'U.S. ExComm';
  const actEmoji=rd.acting==='US'?'🇺🇸':'☭';
  const reactEmoji=rd.acting==='US'?'☭':'🇺🇸';

  let html=`<div class="pbadge ph-wait"><span class="pdot"></span>${actEmoji} ${actTeamName} has announced — both teams confirm below</div>`;

  // Section 1: Acting team's decision (confirmed in gold, others locked)
  html+=`<div class="scard">
    <h3>${actEmoji} ${actTeamName} Decision — Announced to the Room</h3>
    <p style="font-size:.84rem;color:var(--ink-mid);margin-bottom:.75rem;line-height:1.6">
      ${isAct?'Your team submitted this decision and announced it verbally.':'Click the option you heard the '+actTeamName+' announce.'}
    </p>
    <div class="dec-opts">`;

  rd._actOpts.forEach(opt=>{
    let cls, clickHandler='';
    if(confirmedActDec===opt.id){
      cls='dec-opt confirmed-opt';
    } else if(!confirmedActDec && !isAct){
      cls='dec-opt pending-opt';
      clickHandler=`onclick="confirmOppDec('${actDecK}','${opt.id}')"`;
    } else if(!confirmedActDec && isAct){
      // Acting team re-confirms their own choice (click to proceed)
      cls='dec-opt pending-opt';
      clickHandler=`onclick="confirmOppDec('${actDecK}','${opt.id}')"`;
    } else {
      cls='dec-opt locked-opt';
    }
    const badge=confirmedActDec===opt.id?`<span class="conf-badge">announced</span>`:'';
    html+=`<div class="${cls}" ${clickHandler}>
      <div class="dec-lbl"><strong>${opt.label}</strong>${badge}<br>${opt.desc}</div>
    </div>`;
  });
  html+=`</div>`;
  if(!confirmedActDec){
    html+=`<p class="fnote" style="text-align:center;margin-top:.5rem">Click the option that was announced to the room.</p>`;
  }
  html+=`</div>`;

  // Section 2: Reacting team's decision entry (only shown after acting is confirmed)
  if(confirmedActDec){
    html+=`<div class="scard">
      <h3>${reactEmoji} ${reactTeamName} Response — Enter After They Announce</h3>
      <p style="font-size:.84rem;color:var(--ink-mid);margin-bottom:.75rem;line-height:1.6">
        The ${reactTeamName} will now deliberate and announce their response. Click the option they choose.
      </p>
      <div class="dec-opts">`;

    rd._reactOpts.forEach(opt=>{
      let cls, clickHandler='';
      if(confirmedReactDec===opt.id){
        cls='dec-opt confirmed-opt';
      } else if(!confirmedReactDec){
        cls='dec-opt pending-opt';
        clickHandler=`onclick="confirmReactDec('${reactDecK}','${opt.id}')"`;
      } else {
        cls='dec-opt locked-opt';
      }
      const badge=confirmedReactDec===opt.id?`<span class="conf-badge">confirmed</span>`:'';
      html+=`<div class="${cls}" ${clickHandler}>
        <div class="dec-lbl"><strong>${opt.label}</strong>${badge}<br>${opt.desc}</div>
      </div>`;
    });
    html+=`</div>`;
    if(!confirmedReactDec){
      html+=`<p class="fnote" style="text-align:center;margin-top:.5rem">Click the option the ${reactTeamName} announces.</p>`;
    }
    html+=`</div>`;
  }

  // Proceed to consequence once both are confirmed
  if(confirmedActDec && confirmedReactDec){
    html+=`<button class="next-btn sbtn-neu" onclick="revealCon()">Both decisions confirmed — reveal the outcome</button>`;
  }

  return html;
}
