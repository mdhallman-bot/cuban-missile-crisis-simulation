// COMPLETION GRADING
// ══════════════════════════════════════════
function calcCompletion(){
  var total = 0, earned = 0;
  var missing = [];

  // Per round checks
  ROUNDS.forEach(function(rd){
    if(rd.acting === 'ARKHIPOV'){
      // Arkhipov reflection
      total += 1;
      var wk = S.team==='US' ? 'r5_us_wait' : (S.role==='hardliner' ? 'r5_ark_refl' : 'r5_ussr_wait');
      if(gr(wk).trim().length > 20){ earned += 1; }
      else { missing.push('Round 5: Your individual reflection'); }
      total += 1;
      if(gr('r5_ark_refl').trim().length > 20){ earned += 1; }
      else { missing.push('Round 5: Arkhipov moment reflection'); }
      return;
    }

    var isAct = S.team === rd.acting;
    var rsnKey = isAct ? 'r'+rd.id+'_act_rsn_'+S.role : 'r'+rd.id+'_react_rsn_'+S.role;
    var decKey = isAct ? 'r'+rd.id+'_act_dec' : 'r'+rd.id+'_react_dec';
    var antKey = isAct ? 'r'+rd.id+'_act_ant' : 'r'+rd.id+'_react_ant';
    var jstKey = isAct ? 'r'+rd.id+'_act_jst' : 'r'+rd.id+'_react_jst';
    var reflKey = 'r'+rd.id+'_refl';

    // Individual reasoning (most important)
    total += 2;
    if(gr(rsnKey).trim().length > 30){ earned += 2; }
    else if(gr(rsnKey).trim().length > 10){ earned += 1; missing.push('Round '+rd.id+': Individual reasoning (incomplete)'); }
    else { missing.push('Round '+rd.id+': Individual reasoning (missing)'); }

    // Team decision
    total += 1;
    if(gr(decKey)){ earned += 1; }
    else { missing.push('Round '+rd.id+': Team decision not recorded'); }

    // Anticipated responses
    total += 1;
    if(gr(antKey).trim().length > 30){ earned += 1; }
    else { missing.push('Round '+rd.id+': Anticipated responses'); }

    // Team justification
    total += 1;
    if(gr(jstKey).trim().length > 30){ earned += 1; }
    else { missing.push('Round '+rd.id+': Team justification'); }

    // Outcome reflection
    total += 1;
    if(gr(reflKey).trim().length > 20){ earned += 1; }
    else { missing.push('Round '+rd.id+': Outcome reflection'); }
  });

  // Debrief questions
  DEB_QS.forEach(function(q, i){
    total += 2;
    var val = S.db[q.id] || '';
    if(val.trim().length > 80){ earned += 2; }
    else if(val.trim().length > 30){ earned += 1; missing.push('Debrief Q'+(i+1)+': Response too brief'); }
    else { missing.push('Debrief Q'+(i+1)+': Not answered'); }
  });

  var pct = total > 0 ? Math.round((earned/total)*100) : 0;
  return {earned:earned, total:total, pct:pct, missing:missing};
}

function renderGrade(){
  var g = calcCompletion();
  var col = g.pct >= 90 ? '#1a5c1a' : g.pct >= 70 ? '#7a5c00' : '#7a1a1a';
  var bg  = g.pct >= 90 ? '#e8f5e8' : g.pct >= 70 ? '#fef5e0' : '#fceaea';
  var bdr = g.pct >= 90 ? '#3a8a3a' : g.pct >= 70 ? '#c8a820' : '#c04040';
  var label = g.pct >= 90 ? 'Complete' : g.pct >= 70 ? 'Mostly complete' : 'Incomplete';

  var missingHtml = '';
  if(g.missing.length > 0 && g.pct < 100){
    missingHtml = '<details style="margin-top:.6rem"><summary style="font-size:.78rem;color:'+col+';cursor:pointer">Show missing items ('+g.missing.length+')</summary><ul style="margin:.4rem 0 0 1rem;font-size:.78rem;color:'+col+';line-height:1.8">'
      + g.missing.map(function(m){return '<li>'+m+'</li>';}).join('')
      + '</ul></details>';
  }

  return '<div style="background:'+bg+';border:1px solid '+bdr+';border-radius:6px;padding:.75rem 1rem;margin-bottom:.9rem">'
    + '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">'
    + '<div style="font-size:.8rem;font-weight:600;color:'+col+'">Completion: '+label+'</div>'
    + '<div style="font-size:1rem;font-weight:700;color:'+col+'">'+g.earned+'/'+g.total+' points ('+g.pct+'%)</div>'
    + '</div>'
    + missingHtml
    + '</div>';
}

// ══════════════════════════════════════════
// DEBRIEF
// ══════════════════════════════════════════
function rndrDebrief(){
  document.querySelectorAll('.screen').forEach(s=>{s.className='screen';s.style.display='none';});
  let deb=document.getElementById('debriefScreen');
  if(!deb){deb=document.createElement('div');deb.id='debriefScreen';document.body.appendChild(deb);}
  deb.className='screen active';deb.style.display='block';
  const escCol=S.esc>=8?'#a02020':S.esc>=5?'#8a7010':'#2a7a2a';
  const gradeHtml=renderGrade();
  let html=`<div class="deb-hdr"><div class="deb-title">Simulation Complete</div>
    <div class="deb-sub">October 28, 1962 — The crisis is over. Now reflect.</div>
    <div style="margin-top:.6rem;font-size:.8rem;color:#666">Final escalation level: <span style="color:${escCol};font-weight:700">${S.esc}/10</span></div>
  </div>
  <div class="deb-body">
    ${gradeHtml}
    <div style="background:var(--paper-dark);border:1px solid var(--border);border-radius:var(--rad);padding:.9rem 1.1rem;margin-bottom:1rem;font-size:.88rem;color:var(--ink-mid);line-height:1.7">
      Answer each question individually — these are your own reflections, not team answers. When finished, click <strong>Save to PDF</strong> to generate your submission.
    </div>`;
  DEB_QS.forEach((q,i)=>{
    html+=`<div class="deb-q">
      <div class="deb-qnum">Debrief Question ${i+1} of ${DEB_QS.length}</div>
      <div class="deb-qtext">${q.q}</div>
      <textarea rows="5" placeholder="Write your response here..." oninput="svDb('${q.id}',this.value)">${S.db[q.id]||''}</textarea>
      <div class="fnote"><strong>Minimum 80 characters to count as complete.</strong></div>
    </div>`;
  });
  html+=`<button class="save-btn" onclick="toPDF()">Save to PDF — Generate Submission</button></div>`;
  deb.innerHTML=html;sv();
}
function svDb(id,val){S.db[id]=val;sv();}

// ══════════════════════════════════════════
// PDF
// ══════════════════════════════════════════
function toPDF(){
  const pv=document.getElementById('printView');
  const ro=(ROLES[S.team]||[]).find(r=>r.id===S.role);
  var g = calcCompletion();
  const gradeColor = g.pct>=90?'#1a5c1a':g.pct>=70?'#7a5c00':'#7a1a1a';
  const gradeBg = g.pct>=90?'#e8f5e8':g.pct>=70?'#fef5e0':'#fceaea';
  const gradeBdr = g.pct>=90?'#3a8a3a':g.pct>=70?'#c8a820':'#c04040';
  const gradeLabel = g.pct>=90?'Complete':g.pct>=70?'Mostly complete':'Incomplete';
  let html=`<div class="pt-hdr">
    <div class="pt-title">Cuban Missile Crisis Simulation — October 1962</div>
    <div class="pt-meta">U.S. History · Cold War Unit</div>
    <div class="pt-meta" style="margin-top:3px"><strong>Student:</strong> ${S.name} &nbsp;|&nbsp; <strong>Team:</strong> ${S.team==='US'?'United States (ExComm)':'Soviet Union (Presidium)'} &nbsp;|&nbsp; <strong>Role:</strong> ${ro?ro.label:S.role} &nbsp;|&nbsp; <strong>Escalation:</strong> ${S.esc}/10</div>
  </div>
  <div style="background:${gradeBg};border:2px solid ${gradeBdr};border-radius:6px;padding:.9rem 1.2rem;margin:1rem 0;display:flex;align-items:center;justify-content:space-between">
    <div>
      <div style="font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:${gradeColor};font-weight:700">Completion Grade</div>
      <div style="font-size:1.1rem;font-weight:700;color:${gradeColor};margin-top:2px">${g.earned} / ${g.total} points &nbsp;·&nbsp; ${g.pct}% &nbsp;·&nbsp; ${gradeLabel}</div>
      ${g.missing.length>0?`<div style="font-size:.75rem;color:${gradeColor};margin-top:4px">Missing: ${g.missing.slice(0,3).join(' · ')}${g.missing.length>3?' · and '+(g.missing.length-3)+' more':''}</div>`:''}
    </div>
  </div>`;

  ROUNDS.forEach((rd,ri)=>{
    if(ri>0)html+=`<div class="pg-break"></div>`;
    if(rd.acting==='ARKHIPOV'){
      html+=`<div class="pt-sec"><div class="pt-sec-title">Round 5 — The Arkhipov Moment (October 27, 1962)</div>`;
      const wk=S.team==='US'?'r5_us_wait':(S.role==='hardliner'?'r5_ark_refl':'r5_ussr_wait');
      html+=`<div class="pt-lbl">Your Individual Response</div><div class="pta">${(gr(wk)||'(no response entered)').replace(/\n/g,'<br>')}</div>`;
      if(S.team==='USSR'&&S.role==='hardliner'){
        html+=`<div class="pt-lbl">Arkhipov Vote</div><div class="pt-dec">${S.arkChoice==='yes'?'Voted YES — authorized nuclear torpedo':'Voted NO — overrode the captain'}</div>`;
      }
      const arf=gr('r5_ark_refl');
      if(arf&&!(S.team==='USSR'&&S.role==='hardliner')){
        html+=`<div class="pt-lbl">Arkhipov Moment Reflection</div><div class="pta">${arf.replace(/\n/g,'<br>')}</div>`;
      }
      html+=`</div>`;return;
    }
    const isAct=S.team===rd.acting;
    const rsnK=isAct?`r${rd.id}_act_rsn_${S.role}`:`r${rd.id}_react_rsn_${S.role}`;
    const decK=isAct?`r${rd.id}_act_dec`:`r${rd.id}_react_dec`;
    const antK=isAct?`r${rd.id}_act_ant`:`r${rd.id}_react_ant`;
    const jstK=isAct?`r${rd.id}_act_jst`:`r${rd.id}_react_jst`;
    const prepK=isAct?`r${rd.id}_obs_${S.role}`:`r${rd.id}_wait_prep_${S.role}`;
    const reflK=`r${rd.id}_refl`;
    const actId=gr('r'+rd.id+'_act_dec');
    const reactId=gr('r'+rd.id+'_react_dec');
    const actOpt=rd._actOpts.find(o=>o.id===actId);
    const reactOpt=rd._reactOpts.find(o=>o.id===reactId);
    const decId=gr(decK);
    const myOpts=isAct?rd._actOpts:rd._reactOpts;
    const myOpt=myOpts.find(o=>o.id===decId);
    const con=(CONS[rd.id]||{})[`${actId}-${reactId}`];
    html+=`<div class="pt-sec"><div class="pt-sec-title">Round ${rd.id} — ${rd.title} (${rd.date})</div>`;
    html+=`<div class="pt-lbl">Your Role</div><div class="pt-dec">${isAct?'Acting team (moved first)':'Reacting team (responded)'} · ${ro?ro.label:S.role}</div>`;
    html+=`<div class="pt-lbl">Your Individual Reasoning</div><div class="pta">${(gr(rsnK)||'(no response entered)').replace(/\n/g,'<br>')}</div>`;
    if(gr(prepK)){html+=`<div class="pt-lbl">Preparation / Observation While Waiting</div><div class="pta">${gr(prepK).replace(/\n/g,'<br>')}</div>`;}
    if(myOpt){html+=`<div class="pt-lbl">Your Team's Decision</div><div class="pt-dec"><strong>${myOpt.label}</strong></div>`;}
    if(gr(antK)){html+=`<div class="pt-lbl">Anticipated Responses &amp; Consequences</div><div class="pta">${gr(antK).replace(/\n/g,'<br>')}</div>`;}
    html+=`<div class="pt-lbl">Team Justification</div><div class="pta">${(gr(jstK)||'(no response entered)').replace(/\n/g,'<br>')}</div>`;
    if(actOpt&&reactOpt){html+=`<div class="pt-lbl">What Both Sides Did</div><div class="pt-dec">🇺🇸 US: ${actOpt.label}<br>☭ USSR: ${reactOpt.label}</div>`;}
    if(con){html+=`<div class="pt-lbl">Outcome</div><div class="pta">${con.t}</div>`;}
    html+=`<div class="pt-lbl">Your Reflection on This Outcome</div><div class="pta">${(gr(reflK)||'(no response entered)').replace(/\n/g,'<br>')}</div>`;
    html+=`</div>`;
  });

  html+=`<div class="pg-break"></div><div class="pt-sec"><div class="pt-sec-title">Debrief Questions — Individual Responses</div>`;
  DEB_QS.forEach((q,i)=>{
    html+=`<div class="pt-lbl">Question ${i+1}: ${q.q}</div><div class="pta">${(S.db[q.id]||'(no response entered)').replace(/\n/g,'<br>')}</div>`;
  });
  html+=`</div>`;

  pv.innerHTML=html;pv.style.display='block';
  document.querySelectorAll('.screen').forEach(s=>s.style.display='none');
  window.print();
  document.querySelectorAll('.screen').forEach(s=>s.style.display='');
  const active=document.querySelector('.screen.active');
  if(active)active.style.display='block';
  pv.style.display='none';
}
</script>
</body>
</html>
